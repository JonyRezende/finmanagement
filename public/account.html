<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minha conta — Finanças</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body class="login-page">
  <header class="app-header">
    <h1>Financial Management</h1>
  </header>

  <main>
    <section class="login-card">
      <h2>Minha conta</h2>

      <p class="account-current">Entrou como <strong id="accountEmail">—</strong></p>

      <form id="emailForm" class="login-form">
        <h3 class="account-section-title">Alterar email</h3>
        <label>Novo email
          <input type="email" id="newEmail" required autocomplete="email" placeholder="novo@exemplo.com" />
        </label>
        <label>Senha atual
          <input type="password" id="emailPassword" required autocomplete="current-password" />
        </label>
        <p id="emailError" class="login-error hidden" role="alert"></p>
        <p id="emailSuccess" class="account-success hidden" role="status"></p>
        <button type="submit" class="login-submit">Atualizar email</button>
      </form>

      <form id="passwordForm" class="login-form" style="margin-top: 28px;">
        <h3 class="account-section-title">Alterar senha</h3>
        <label>Senha atual
          <input type="password" id="currentPassword" required autocomplete="current-password" />
        </label>
        <label>Nova senha
          <input type="password" id="newPassword" required autocomplete="new-password" minlength="8" />
        </label>
        <label>Confirmar nova senha
          <input type="password" id="newPasswordConfirm" required autocomplete="new-password" minlength="8" />
        </label>
        <p id="passwordError" class="login-error hidden" role="alert"></p>
        <p id="passwordSuccess" class="account-success hidden" role="status"></p>
        <button type="submit" class="login-submit">Atualizar senha</button>
      </form>

      <a href="/index.html" class="login-toggle">Voltar pra home</a>
      <a href="#" id="logoutLink" class="login-toggle account-logout">Sair da conta</a>
    </section>
  </main>

  <script src="account.js"></script>
</body>
</html>
