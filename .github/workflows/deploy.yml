name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_HOST: ${{ secrets.GCP_HOST }}
      GCP_USER: ${{ secrets.GCP_USER }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$GCP_HOST" >> ~/.ssh/known_hosts

      - name: Pull, install deps and restart
        run: |
          ssh -i ~/.ssh/id_deploy "$GCP_USER@$GCP_HOST" \
            'sudo -u Johnny -- git -C /home/Johnny/financas-app pull --ff-only && \
             sudo -u Johnny /home/Johnny/financas-app/.venv/bin/pip install -q -r /home/Johnny/financas-app/requirements.txt && \
             sudo systemctl restart financas && \
             sleep 2 && \
             sudo systemctl is-active financas'

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://finpilot.jonyrezende.dev)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "site nao respondeu 200" && exit 1